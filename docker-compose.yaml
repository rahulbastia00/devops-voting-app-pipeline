services:
  vote:
    image: YOUR_DOCKERHUB_USERNAME/examplevotingapp_vote:latest
    container_name: vote-service
    ports:
      - "5000:80"
    environment:
      - OPTION_A=Cats
      - OPTION_B=Dogs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  result:
    image: YOUR_DOCKERHUB_USERNAME/examplevotingapp_result:latest
    container_name: result-service
    ports:
      - "5001:4000"
    environment:
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: YOUR_DOCKERHUB_USERNAME/examplevotingapp_worker:latest
    container_name: worker-service
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: redis-service
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
    driver: local
