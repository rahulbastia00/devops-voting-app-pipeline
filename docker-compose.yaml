services:
  vote:
    build:
      context: ./vote
      dockerfile: Dockerfile
    container_name: vote-service
    ports:
      - "5000:80"
    environment:
      - OPTION_A=Cats
      - OPTION_B=Dogs
    networks:
      - front-tier
      - back-tier
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  result:
    build:
      context: ./result
      dockerfile: Dockerfile
    container_name: result-service
    ports:
      - "5001:4000"
    environment:
      - PORT=4000
    networks:
      - front-tier
      - back-tier
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: worker-service
    networks:
      - back-tier
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: redis-service
    networks:
      - front-tier
      - back-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge

volumes:
  db-data:
    driver: local