name: CI - Build, Scan, and Push to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "vote/**"
      - "result/**"
      - "worker/**"
      - "k8s/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: vote
            context: ./vote
          - name: result
            context: ./result
          - name: worker
            context: ./worker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build locally into the runner's Docker daemon without pushing
      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service.name }}:scan-temp
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Run Trivy Vulnerability Scan
      - name: Run Trivy Image Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service.name }}:scan-temp
          format: "table"
          exit-code: "0" # Keep as '0' to report issues without failing the build initially; switch to '1' to enforce strict blocking
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Step 3: Log in to Docker Hub (only runs if previous steps pass)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Tag and Push to Docker Hub
      - name: Push Scanned Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
